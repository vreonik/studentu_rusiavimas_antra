name: Build Studentų Rūšiavimo Sistema v3.0

on:
  push:
    branches: [main, v3.0]
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Install Inno Setup
      run: choco install innosetup -y
      
    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      
    - name: Build project
      run: cmake --build build --config Release
      
    - name: Prepare for installer
      shell: cmd
      run: |
        echo "=== Preparing files for installer ==="
        
        echo "Current directory:"
        cd
        dir
        
        echo "Checking build directory..."
        dir build\
        
        echo "Checking build\bin..."
        dir build\bin\
        
        echo "Checking build\Release..."
        dir build\Release\
        
        echo "Copying executable..."
        if exist "build\bin\studentu-rusiavimo-sistema.exe" (
          echo "Found in build\bin\"
          mkdir Release 2>nul
          copy "build\bin\studentu-rusiavimo-sistema.exe" "Release\"
        ) else (
          echo "ERROR: Executable not found in build\bin\"
          dir /s *.exe
          exit 1
        )
        
        echo "=== Verification ==="
        dir Release\
        
    - name: Create Windows Installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        & "$iscc" "installer/setup.iss"
        
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudentuRusiavimoSistema-Setup
        path: dist/*.exe
